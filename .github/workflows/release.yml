# Checks only: typecheck and tests, on every branch push and on tags `v*`.
#
# No release is built here. A release is built, signed and notarised on the
# owner's Mac, as for the Mac app, so the Developer ID certificate and the
# notarisation key never enter GitHub (README, "Releasing an update").
#
# Windows runs as a test only: it must keep building, but nothing is released
# for it and no installer is kept until it can be code-signed.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest # arm64 host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - name: Package as a test (the installer is not kept)
        run: npx electron-builder --win nsis --x64 --publish never
