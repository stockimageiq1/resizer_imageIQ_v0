appId: com.stockimageiq.resizer
productName: ImageIQ Resizer

directories:
  buildResources: build
  output: release

# Ship only the built app; src/test/scripts/dist stay out of the package.
# node_modules for production dependencies are added automatically.
files:
  - out/**
  - package.json

# CRITICAL: binaries and native modules cannot load/spawn from inside the
# asar archive.
#  - ffmpeg-static: the ffmpeg binary is spawned as a child process — must be
#    a real file. The engine's ffmpegPath() rewrites app.asar → app.asar.unpacked.
#  - sharp + @img/*: sharp >= 0.33 ships its native code in per-platform
#    @img/sharp-<os>-<cpu> packages (the officially recommended layout);
#    unpack them all so require() hits real .node files.
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"

# Electron fuses (as the Mac app), flipped in the packaged binary by
# electron-builder's own @electron/fuses: ELECTRON_RUN_AS_NODE, NODE_OPTIONS /
# NODE_EXTRA_CA_CERTS and --inspect* / SIGUSR1 are ignored, so nothing outside
# the app can run code inside it. The app needs none of them: ffmpeg is a
# separate binary and nothing uses process.fork.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Flipping a fuse changes the binary; electron-builder signs right after the
  # flip. Unsigned builds have no signing step, and on Apple silicon an unsigned
  # binary is killed at launch (exit 137), so they add
  # -c.electronFuses.resetAdHocDarwinSignature=true (an ad hoc signature).

# Signing: electron-builder finds the Developer ID Application identity in the
# keychain by itself (or the one CSC_NAME names). No name or hash of an identity
# is written in this repository. forceCodeSigning: a build without a usable
# identity fails instead of quietly producing an unsigned app; unsigned builds
# for quick tries override this block from the command line (dist:mac:unsigned,
# package:mac:x64:unsigned). Notarisation needs APPLE_API_KEY, APPLE_API_KEY_ID,
# APPLE_API_ISSUER and APPLE_TEAM_ID in the environment (.env.signing.example,
# the same variables as the Mac app). electron-builder notarises and staples
# the .app before the dmg and zip are made from it; it does not notarise the
# dmg, scripts/notarize-mac-dmg.sh does.
mac:
  category: public.app-category.photography
  icon: build/icon.icns
  forceCodeSigning: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # No arch here: the command line chooses it (--arm64 / --x64). The zip is
  # what electron-updater installs on macOS; the dmg is the download.
  target:
    - dmg
    - zip
  # stable, versionless asset names for download links
  artifactName: ImageIQ-Resizer-mac-${arch}.${ext}
  # Per-arch dmgs instead of universal: sharp's per-arch @img packages and
  # ffmpeg-static's single-arch postinstall binary do not merge cleanly into
  # one universal asar (mergeASARs requires identical file sets).
  # npm run dist:mac builds arm64 here; npm run package:mac:x64 builds Intel
  # in a separate worktree with the x64 packages installed.

# The dmg is signed, notarised and stapled after electron-builder has made it
# (scripts/notarize-mac-dmg.sh), so it stays out of the update info: its
# blockmap and sha512 would describe the dmg as it was before stapling.
dmg:
  sign: false
  writeUpdateInfo: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # stable, versionless asset name for download links
  artifactName: ImageIQ-Resizer-win-x64.exe
  # keep macOS binaries out of the Windows package (relevant when
  # cross-building from a Mac where both platforms' binaries coexist)
  files:
    - "!node_modules/ffmpeg-static/ffmpeg"
    - "!node_modules/@img/sharp-darwin-*/**"
    - "!node_modules/@img/sharp-libvips-darwin-*/**"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

# Unified NSIS toolset (3.12): ships native binaries per host platform —
# the legacy default bundle is x86_64-only on macOS and fails on arm64
# hosts without Rosetta.
toolsets:
  nsis: 1.2.1

# electron-updater feed: GitHub Releases of a separate public repository that
# holds only the release files, no code (as the Mac app). electron-builder
# writes app-update.yml into the package from this block. It never uploads:
# every build command passes --publish never, the owner publishes by hand
# (README, "Releasing an update").
publish:
  provider: github
  owner: stockimageiq1
  repo: stockimageiq-resizer-releases
  releaseType: release
